name: ai-privacy-guard-tests

on:
  pull_request:
    paths:
      - "ai-privacy-guard/**"
      - ".github/workflows/ai-privacy-guard-tests.yml"
  push:
    branches: [main]
    paths:
      - "ai-privacy-guard/**"
      - ".github/workflows/ai-privacy-guard-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-privacy-guard

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q
